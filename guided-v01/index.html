<style>

:#405a47}.sim strong{font-weight:650}.speechbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 24px;font-size:14px;background:#ffffffed;border-bottom:1px solid #dce4da}.speechbar button{font-size:16px;min-height:48px}main{padding:24px 28px 30px;min-height:420px}main>*+*{margin-top:20px}.kicker{font-size:14px;font-weight:700;color:var(--muted);letter-spacing:.5px}.bubble{background:#ffffffed;border:1px solid #ffffff;border-radius:22px;padding:20px;box-shadow:0 5px 20px #2b4c3210}.bubble h1+p{margin-top:10px}.listen{margin-top:15px;min-height:50px;font-size:16px;padding:10px 14px;background:#f5f8f2;box-shadow:none}.card{background:#fffffff2;border:1px solid #d8e1d6;border-radius:21px;padding:20px;box-shadow:0 4px 17px #304b3207}.card>*+*{margin-top:12px}.actions{display:grid;gap:11px;margin-top:22px}.actions button{width:100%}.actions.two{grid-template-columns:1fr 1fr}.progress{display:flex;gap:12px;align-items:center;font-size:16px;font-weight:650}.track{flex:1;height:6px;background:#dfe8dc;border-radius:20px;overflow:hidden}.track span{display:block;height:100%;background:#6e9275}.photo-capture{display:grid;justify-items:center;gap:8px;width:100%;padding:17px;border-radius:24px;background:#fffffff5;border:1px solid #bdcfbc;box-shadow:0 8px 24px #294b3210;text-align:center}.photo-capture svg{width:min(100%,230px);height:135px;pointer-events:none}.photo-position{font-size:16px;font-weight:650;color:#425b48}.photo-tap{font-size:19px;font-weight:750}.photo-sub{font-size:15px;font-weight:400;color:var(--muted)}.photo-state{font-size:17px;padding:10px 14px;background:#eff5eb;border:1px solid #d5e0ce;border-radius:13px}.photo-back{margin-top:16px}.photo-back button{width:100%}.choices{display:grid;gap:11px}.answer{display:block;width:100%;padding:15px 17px;text-align:left;font-weight:550;background:#fffffff2}.answer .mark{display:block;font-size:15px;font-weight:650;margin-top:4px}.selected{background:#ecf4e7;border:2px solid #6b8c6e}.checkline{padding:13px 0;border-bottom:1px solid #dce4d8}.checkline:last-child{border:0}.checkhead{display:flex;align-items:center;justify-content:space-between;gap:12px}.checkhead button{min-height:48px;padding:8px 12px;font-size:16px;flex:none}.thumbs{display:grid;grid-template-columns:1fr 1fr;gap:12px}.thumbs svg{display:block;width:100%;height:90px}.thumbs .card{padding:12px;min-width:0}.ticket{background:#ffffffed;border:1px solid #d4dfd0;border-radius:17px;padding:14px 18px;box-shadow:0 3px 15px #2b4a3008}.ticket strong{display:block}.notice{padding:14px 16px;border-radius:14px;background:#fff5e7;color:#774621;border:1px solid #d9c4a6;font-size:17px}.error{background:#fff1eb;color:#813c29;border-color:#dbb6a7}.success{font-weight:700;color:var(--green)}textarea{display:block;width:100%;min-height:130px;resize:vertical;background:#fff;border:1px solid #97ac9b;border-radius:14px;padding:12px;line-height:1.65}.note-label{display:block;font-weight:650}.saved-note{white-space:pre-wrap;overflow-wrap:anywhere}.record{display:block;width:100%;text-align:left;padding:20px;background:#fffffff2;border:1px solid #c9d7c6;border-radius:20px;box-shadow:0 4px 15px #2b4c3008}.record span,.record strong{display:block}.record span{font-size:16px;margin-top:5px}.boundary{border-left:3px solid #a9bea3;padding-left:13px;font-size:16px;color:#3b5142}.note-status{font-size:15px;margin-top:8px}.badge{font-size:13px;font-weight:500;background:#eef4ea;border-radius:20px;padding:4px 9px}.empty{padding:12px 0}details summary{cursor:pointer;min-height:52px;display:list-item;font-weight:650}details>*+*{margin-top:14px}footer{padding:18px 24px;border-top:1px solid #dce4d8;font-size:14px;color:var(--muted);background:#f8faf5ed}dialog{width:460px;max-width:calc(100vw - 28px);max-height:calc(100dvh - 28px);overflow:auto;border:1px solid #fff;border-radius:25px;background:#fcfdf9;color:var(--ink);padding:24px;box-shadow:0 18px 70px #1b352d40}dialog::backdrop{background:#253e354d;backdrop-filter:blur(3px)}dialog h <body><div class="shell">
<header class="top"><span class="brand">Bonsai AI <span class="badge">逐步引导版</span></span><nav class="row" aria-label="页面去向"><button data-action="home">首页</button><button data-action="history">我的记录</button></nav></header>
<div class="sim"><strong>模拟体验 · 只用示意材料</strong> · 不提供真实诊断或养护建议</div>
<div class="speechbar"><span id="speech-status" role="status" aria-live="polite">可点“听说明”朗读，不会自动播放。</span><button id="stop-speech" data-action="stop-speech" hidden>停止朗读</button></div>
<main id="app" tabindex="-1"></main>
<footer>记录仅保存在当前浏览器。换浏览器、设备或清理网站数据后，可能看不到原记录。<br>不用上传真实照片或填写真实个人信息。体验感受请在微信告诉发链接的人，网页不会自动收到反馈。</footer>
</div>
<dialog id="confirm-dialog" aria-labelledby="confirm-title"><h2 id="confirm-title"></h2><p id="confirm-copy"></p><p id="confirm-error" class="notice error" role="alert" hidden></p><div class="actions"><button class="primary" data-action="confirm">确认模拟提交</button><button data-action="cancel">先不提交，返回检查</button></div></dialog>
<noscript>此模拟网页需要浏览器启用 JavaScript。未启用时无法准备或提交，尚未产生记录。</noscript>
<script>
(()=>{'use strict';
const LABELS=['整体 1','整体 2','局部 1','局部 2','芽 1','芽 2'];
const QUESTIONS=['关于这棵示例树的变化，你知道什么？','关于相关操作或干扰，你知道什么？','关于浇水、干燥过程，你能提供什么？'];
const ANSWER_OPTIONS=[
 [{id:'change',label:'我观察到变化',identity:'用户陈述观察到变化；未判定改善、恶化或稳定',text:true}, {id:'no_change',label:'在我观察的范围内未见变化',identity:'用户陈述未见变化；不是专业稳定结论'}, {id:'unknown',label:'不清楚',identity:'事实不清楚，保留未知'}, {id:'no_record',label:'没有相关记录可提供',identity:'没有记录；不表示没有变化'}],
 [{id:'event',label:'我知道有相关操作或干扰',identity:'用户陈述有相关情况；没有据此认定病因',text:true}, {id:'no_event',label:'我明确知道未发生相关操作',identity:'用户明确陈述未发生，仅限其了解范围；未核实具体时间范围'}, {id:'unknown',label:'不清楚',identity:'事实不清楚；不当作没有操作'}, {id:'no_record',label:'没有相关记录可提供',identity:'无记录；不能据此判断操作有没有发生'}],
 [{id:'record',label:'有记录，可以作文字摘述',identity:'声明持有记录；原始记录未提交、未核验',text:true}, {id:'recall',label:'没有记录，但有大致回忆',identity:'大致回忆／用户陈述；非实测或可靠连续记录',text:true}, {id:'no_record',label:'没有记录可提供',identity:'无记录；不等于未浇水或状态正常'}, {id:'unknown',label:'不清楚',identity:'过程事实不清楚；不形成水分判断'}]
];
const GROUP_HELP=['帮助了解全树范围和不同方向的情况。','帮助定位问题位置、看清相关组织细节。','与相应判断有关时，帮助了解芽位信息及不同部位的情况。'];

function art(slot,variant=1){const palettes=[['#b5c8a5','#6d8b73'],['#c4d0bb','#8a9c73'],['#c4d6cf','#678d85']];const c=palettes[variant-1]||palettes[0];return `<svg viewBox="0 0 100 80" role="img" aria-label="${LABELS[slot]}示意图${variant}（模拟材料，非专业拍摄样例）"><rect x="9" y="7" width="82" height="65" rx="12" fill="${c[0]}"/><path d="M50 60V24M50 43l-18-12M50 34l18-12" stroke="${c[1]}" stroke-width="3" fill="none"/><circle cx="30" cy="28" r="9" fill="#f8faf4"/><circle cx="67" cy="20" r="11" fill="#f8faf4"/><path d="M36 58h28l-5 10H41Z" fill="${c[1]}"/><text x="80" y="63" font-family="sans-serif" font-size="12" fill="#314b3a">${variant}</text></svg>`;}
const KEY='bonsai-pe-guided-readaloud-v01';
const $=id=>document.getElementById(id), clone=x=>JSON.parse(JSON.stringify(x));
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const button=(label,action,cls='',attrs='')=>`<button class="${cls}" data-action="${action}" ${attrs}>${label}</button>`;
let state, lastRaw=null, halted=false, issue='', dialogIntent=null, busy=false, pending=null;
let photoView=0,photoPress=null,photoTransit=null,photoTimer=null,photoToken=0,photoGuardUntil=0;
const fresh=()=>({schema:1,nextDraft:1,nextRecord:1,draft:null,records:[],route:{screen:'home'}});
const freshAnswers=()=>ANSWER_OPTIONS.map(()=>({choice:null,notes:{}}));
const stamp=()=>new Date().toISOString();
const signature=x=>JSON.stringify([x.tree,x.slots,x.answers]);
const date=x=>new Date(x).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false});
const validDate=x=>typeof x==='string'&&Number.isFinite(Date.parse(x));
const validId=(x,p)=>typeof x==='string'&&new RegExp('^'+p+'-[1-9]\\d*$').test(x);
const slotsOK=a=>Array.isArray(a)&&a.length===6&&a.every(n=>n===null||[1,2,3].includes(n));
function answersOK(a){return Array.isArray(a)&&a.length===3&&a.every((v,i)=>v&&Object.keys(v).every(k=>['choice','notes'].includes(k))&&(v.choice===null||ANSWER_OPTIONS[i].some(o=>o.id===v.choice))&&v.notes&&typeof v.notes==='object'&&!Array.isArray(v.notes)&&Object.entries(v.notes).every(([k,t])=>ANSWER_OPTIONS[i].some(o=>o.id===k&&o.text)&&typeof t==='string'&&t.length<=400));}
function validate(s){
 if(!s||s.schema!==1||!Number.isSafeInteger(s.nextDraft)||s.nextDraft<1||!Number.isSafeInteger(s.nextRecord)||s.nextRecord<1||!Array.isArray(s.records)||s.records.length>500||!s.route||!['home','step','review','history','detail'].includes(s.route.screen))throw Error('state');
 const ids=new Set(),intents=new Set();let maxDraft=0,maxRecord=0;
 for(const r of s.records){if(!r||!validId(r.id,'SIM')||ids.has(r.id)||!validId(r.intent,'D')||intents.has(r.intent)||!['A','B'].includes(r.tree)||!validDate(r.created)||!slotsOK(r.slots)||r.slots.some(n=>n===null)||!answersOK(r.answers)||r.result!=='r2'||!r.binding||r.binding.recordId!==r.id||r.binding.tree!==r.tree||r.binding.signature!==signature(r)||Object.hasOwn(r,'supplement'))throw Error('record binding');ids.add(r.id);intents.add(r.intent);maxDraft=Math.max(maxDraft,Number(r.intent.slice(2)));maxRecord=Math.max(maxRecord,Number(r.id.slice(4)));}
 if(s.draft){const d=s.draft;if(!validId(d.id,'D')||intents.has(d.id)||!['A','B'].includes(d.tree)||!validDate(d.created)||!slotsOK(d.slots)||!answersOK(d.answers)||Object.hasOwn(d,'supplement'))throw Error('draft');maxDraft=Math.max(maxDraft,Number(d.id.slice(2)));}
 if(s.nextDraft<=maxDraft||s.nextRecord<=maxRecord)throw Error('counter');
 if(['step','review'].includes(s.route.screen)&&!s.draft)throw Error('draft route');
 if(s.route.screen==='step'&&(!Number.isInteger(s.route.index)||s.route.index<0||s.route.index>8))throw Error('step');
 if(s.route.screen==='detail'&&!ids.has(s.route.recordId))throw Error('target');return true;
}
function read(){cancelPhotoTransition();stopSpeech();if(pending){issue='有文字尚未保存。请先重试保存；暂不重新读取，以免丢失。';render();return false;}try{const raw=localStorage.getItem(KEY),next=raw===null?fresh():JSON.parse(raw);validate(next);lastRaw=raw;state=next;halted=false;issue='';render();return true;}catch(e){halted=true;state=fresh();issue='记录暂时无法读取。为保护已有内容，已停止操作，没有覆盖原数据。请稍后重试读取。';render();return false;}}
function commit(change,focus=true,redraw=true){if(halted)return false;try{if(localStorage.getItem(KEY)!==lastRaw){halted=true;throw Error('another tab');}const next=clone(state);change(next);validate(next);const raw=JSON.stringify(next);localStorage.setItem(KEY,raw);lastRaw=raw;state=next;issue='';if(redraw)render(focus);return true;}catch(e){issue=halted?'另一页面已更改记录。已停止当前操作，避免覆盖；请重试读取。':'这次操作未保存、未完成。原记录没有改动，请重试；暂不要刷新或关闭。';if(redraw)render(false);return false;}}
function noteValue(i){const a=state.draft.answers[i];return pending&&pending.draftId===state.draft.id&&pending.i===i&&pending.choice===a.choice?pending.value:(a.notes[a.choice]||'');}
function saveNote(i,value){const d=state.draft,a=d?.answers[i],opt=ANSWER_OPTIONS[i]?.find(o=>o.id===a?.choice&&o.text);if(halted||!d||!opt)return false;pending={draftId:d.id,i,choice:a.choice,value};const entry=pending;const ok=commit(s=>{if(s.draft?.id!==entry.draftId||s.draft.answers[i].choice!==entry.choice)throw Error('note target');s.draft.answers[i].notes[entry.choice]=entry.value;},false,false);if(ok)pending=null;const saveButton=$('note-save');if(saveButton)saveButton.textContent=ok?'保存说明':'重试保存说明';const el=$('note-status');if(el)el.textContent=ok?'这段示例文字已保存。':'这段文字尚未保存，仅在当前页面保留。请重试保存，暂不要离开。';const error=$('page-error');if(error){error.hidden=!issue;error.textContent=issue;}return ok;}
function flush(){if(!pending)return true;return saveNote(pending.i,pending.value);}
function navigate(screen,extra={}){cancelPhotoTransition();if(!flush())return false;return commit(s=>{s.route={screen,...extra};});}
function start(tree='A'){if(!flush())return;if(state.draft){openDialog('replace',state.draft.id,tree);return;}createDraft(tree);}
function createDraft(tree){return commit(s=>{s.draft={id:'D-'+s.nextDraft++,tree,created:stamp(),slots:Array(6).fill(null),answers:freshAnswers()};s.route={screen:'step',index:0};});}
function currentRecord(){return state.records.find(r=>r.id===state.route.recordId);}
function openDialog(kind,id,tree){cancelPhotoTransition();stopSpeech();dialogIntent={kind,id,tree};$('confirm-title').textContent=kind==='submit'?'确认提交这份示意资料？':'另开一份准备？';$('confirm-copy').textContent=kind==='submit'?'提交后，这份资料只能回看，不能修改。需要重拍时，可另开一份准备；这里只演示流程，不进行真实诊断。':'已有一份未提交资料。另开会替换这份准备，已提交的记录仍会保留。';const buttons=$('confirm-dialog').querySelectorAll('button');buttons[0].textContent=kind==='submit'?'确认模拟提交':'另开一份准备';buttons[1].textContent=kind==='submit'?'先不提交，返回检查':'取消，保留原准备';$('confirm-error').hidden=true;$('confirm-dialog').showModal();}
function askSubmit(){if(halted||!flush()||state.route.screen!=='review'||!state.draft)return;const absent=state.draft.slots.findIndex(n=>n===null);if(absent!==-1){navigate('step',{index:absent,edit:true});issue='还有示意材料未选择，请先准备这一份。';render();return;}openDialog('submit',state.draft.id);}
function confirmAction(){if(busy||!dialogIntent||halted)return;const intent=dialogIntent;busy=true;let ok=false;try{if(intent.kind==='replace'){if(state.draft?.id!==intent.id)throw Error('draft changed');ok=createDraft(intent.tree);}else{if(state.route.screen!=='review'||state.draft?.id!==intent.id||state.draft.slots.some(n=>n===null))throw Error('submission target');ok=commit(s=>{const d=s.draft;if(s.records.some(r=>r.intent===d.id))throw Error('duplicate');const r={id:'SIM-'+s.nextRecord++,intent:d.id,tree:d.tree,created:stamp(),slots:clone(d.slots),answers:clone(d.answers),result:'r2',binding:null};r.binding={recordId:r.id,tree:r.tree,signature:signature(r)};s.records.push(r);s.draft=null;s.route={screen:'detail',recordId:r.id};});}if(ok){dialogIntent=null;$('confirm-dialog').close();}else{$('confirm-error').textContent=issue;$('confirm-error').hidden=false;}}catch(e){$('confirm-error').textContent='资料对应发生变化，未提交。请取消并重新检查。';$('confirm-error').hidden=false;}finally{busy=false;}}
function next(){if(!flush()||!state.draft||state.route.screen!=='step'||state.route.index<6)return;const i=state.route.index;if(state.route.edit)return navigate('review');return i===8?navigate('review'):navigate('step',{index:i+1});}
function previous(){if(state.route.edit)return navigate('review');const i=state.route.index;return i===0?navigate('home'):navigate('step',{index:i-1});}
function cancelPhotoTransition(){++photoToken;clearTimeout(photoTimer);photoTimer=null;photoTransit=null;photoPress=null;}
function capturePhoto(el,e){
 if(halted||photoTransit||Date.now()<photoGuardUntil||e.detail>1||el.isConnected===false)return;
 const q=state.route,d=state.draft,index=Number(el.dataset.photoIndex),view=Number(el.dataset.photoView);
 if(q.screen!=='step'||q.index>=6||q.index!==index||!d||d.id!==el.dataset.photoDraft||view!==photoView)return;
 if(e.detail>0){const press=photoPress;photoPress=null;if(!press||press.element!==el||press.view!==view)return;}
 if(!flush())return;cancelPhotoTransition();
 const draftId=d.id,edit=!!q.edit;
 if(!commit(s=>{if(s.draft?.id!==draftId||s.route.screen!=='step'||s.route.index!==index)throw Error('photo target');s.draft.slots[index]=s.draft.slots[index]??1;},false,false)){render(false);return;}
 const transit={token:++photoToken,draftId,index,edit};photoTransit=transit;render(false,true);
 photoTimer=setTimeout(()=>{if(photoTransit!==transit||transit.token!==photoToken||halted||document.hidden||state.draft?.id!==draftId||state.route.screen!=='step'||state.route.index!==index||!!state.route.edit!==edit)return;photoGuardUntil=Date.now()+280;photoTransit=null;photoTimer=null;if(edit)navigate('review');else navigate('step',{index:index+1});},650);
}
function speechBlock(id,html){return `<section class="bubble"><div id="${id}">${html}</div>${button('🔊 点这里听说明','listen','listen',`data-speech="${id}"`)}</section>`;}
function progress(i){const label=i<6?'照片准备 '+(i+1)+'/6':i<9?'树的情况 '+(i-5)+'/3':'提交前检查';return `<div class="progress" aria-label="准备进度"><span>${label}</span><span class="track" aria-hidden="true"><span style="width:${(i+1)*10}%"></span></span></div>`;}
function answerHTML(a,i){const opt=ANSWER_OPTIONS[i].find(o=>o.id===a.choice),inactive=Object.entries(a.notes).filter(([k,t])=>k!==a.choice&&t);return `<p><strong>${opt?esc(opt.label):'未回答'}</strong></p><p class="small muted">${opt?esc(opt.identity):'尚未取得回答，不当作没有发生或状态正常。'}</p>${opt?.text?`<p class="small muted">${a.notes[a.choice]?'可选示例说明（只是用户陈述，未核实）：':'未填写可选说明；没有据此取得具体事实。'}</p><p class="saved-note">${esc(a.notes[a.choice]||'')}</p>`:''}${inactive.length?`<details><summary>未采用的暂存文字</summary><p class="small muted">不属于当前回答，未据此形成判断。</p>${inactive.map(([k,t])=>`<p>${esc(ANSWER_OPTIONS[i].find(o=>o.id===k).label)}</p><p class="saved-note">${esc(t)}</p>`).join('')}</details>`:''}`;}
function home(){const d=state.draft;return `${speechBlock('home-help','<p class="kicker">跟着提示，一步一步来</p><h1>一步一步，<br>把资料准备好。</h1><p>点示意图，模拟准备六张盆景照片。再说说树的情况，看看模拟反馈。点错了可以返回修改。</p><p class="small">不用拍真实照片，也不用填个人信息。</p>')}${d?`<div class="card"><h2>还有未提交的资料</h2><p>已准备 ${d.slots.filter(Boolean).length}/6 张示意材料。内容已保留，可以接着准备。</p></div>`:''}<div class="actions">${d?button('继续准备','continue','primary')+button('另开一份准备','begin'):button('开始体验','begin','primary')}${button('回看我的记录','history')}</div><p class="small muted">只在当前浏览器保存。看不懂或卡住时，请在微信告诉发链接的人。</p>`;}
function step(){const {index:i,edit}=state.route,d=state.draft;let body;
 if(i<6){const prompts=['准备整棵盆景的照片','再准备一张整体照片','准备问题部位的照片','再准备一张局部照片','准备芽的照片','再准备一张芽的照片'];body=`${speechBlock('material-help',`<p class="kicker">${LABELS[i]} · 已准备 ${d.slots.filter(Boolean).length}/6</p><h1>${prompts[i]}</h1><p class="small">${GROUP_HELP[Math.floor(i/2)]}</p><p>点下面这张图，模拟拍照上传。</p><p class="small">本次不用实际拍照或上传。示意图不是专业拍摄样例。</p>${i===1?'<p class="small">这里体验的是拍摄盆景照片并上传的过程，本次用点图代替实际操作。</p>':''}`)}<button class="photo-capture" data-action="photo" data-photo-view="${photoView}" data-photo-draft="${d.id}" data-photo-index="${i}" ${photoTransit?'disabled':''}><span class="photo-position">${LABELS[i]} · ${['整棵盆景','问题部位','芽'][Math.floor(i/2)]}</span>${art(i,d.slots[i]??1)}<span class="photo-tap">${photoTransit?'✓ 已准备好':'点这张图，模拟拍照上传'}</span><span class="photo-sub">${photoTransit?(edit?'即将回到提交检查':'即将进入下一步'):d.slots[i]?'已保留上次准备的内容':'点后保存，自动进入下一步'}</span></button><p class="photo-state" role="status">${photoTransit?'✓ 已准备好，已保存。':d.slots[i]?'这张已准备好，点图可继续。':'这一步还未准备。'}</p><div class="photo-back">${button(edit?'返回提交检查':i===0?'返回首页':'返回上一张','previous')}</div>`;}
 else{const q=i-6,a=d.answers[q],opt=ANSWER_OPTIONS[q].find(o=>o.id===a.choice);body=`${speechBlock('question-help',`${q===0?'<p class="kicker">照片准备好了，接下来了解树的情况</p>':'<p class="kicker">树的情况 · 第 '+(q+1)+' / 3 题</p>'}${q===0?'<p class="small">接下来模拟收集这棵盆景树的变化、相关操作和浇水情况。本次仍是引导测试，请按示例作答。</p>':''}<h1>${QUESTIONS[q]}</h1><p>按知道的情况选择；不清楚就选“不清楚”，也可以不答。不需要猜病因。</p>`)}<div class="choices" role="group" aria-label="背景回答选项">${ANSWER_OPTIONS[q].map(o=>button(esc(o.label)+(a.choice===o.id?'<span class="mark">✓ 已选择</span>':''),'answer','answer'+(a.choice===o.id?' selected':''),`data-choice="${o.id}" aria-pressed="${a.choice===o.id}"`)).join('')}</div><p class="small boundary">${opt?esc(opt.identity):'当前未回答；不会自动替你作答。'}</p>${opt?.text?`<div class="card"><label class="note-label" for="note">补充说两句（可不填）</label><p class="small muted">只写示例说明，可写大约何时、发生了什么或涉及哪里。不知道可留空；不填个人信息。最多400字。</p><textarea id="note" maxlength="400" rows="3" data-note="${q}" placeholder="写一点示例内容，也可以留空">${esc(noteValue(q))}</textarea><p id="note-status" class="note-status" role="status">${pending?'文字尚未保存，请重试。':'这里只记录你的说法，不会自动生成建议。'}</p>${button(pending?'重试保存说明':'保存说明','save-note','', 'id="note-save"')}</div>`:''}${Object.keys(a.notes).some(k=>k!==a.choice&&a.notes[k])?'<p class="small muted">其他选项的文字仍保留，未当作当前回答。切回原选项可继续编辑。</p>':''}${a.choice!==null?button('这题先不答','skip','quiet'):''}<div class="actions">${button(edit?'保存并回到提交检查':i===8?'检查准备好的资料':'下一步'+(a.choice===null?'（这题可不答）':''),'next','primary')}${button(edit?'返回提交检查':i===6?'返回上一张':'返回上一题','previous')}</div>`;}
 return `${progress(i)}${body}<p class="small muted">尚未提交。已保存的内容会保留，可以返回查看或修改。</p>`;
}
function review(){const d=state.draft;return `${progress(9)}${speechBlock('review-help','<p class="kicker">最后检查一下</p><h1>这些资料，准备好了吗？</h1><p>需要改哪里，就点那一项旁边的“修改”。确认提交前，不会产生提交记录。</p>')}<section class="card"><h2>六份示意材料 · ${d.slots.filter(Boolean).length}/6</h2>${LABELS.map((label,i)=>`<div class="checkline"><div class="checkhead"><span>${label}<br><strong>${d.slots[i]?'示意图'+d.slots[i]:'未选择'}</strong></span>${button('修改','edit','',`data-index="${i}" aria-label="修改${label}"`)}</div></div>`).join('')}</section><section class="card"><h2>三道背景问题（都可不答）</h2>${QUESTIONS.map((q,i)=>`<div class="checkline"><div class="checkhead"><h3>${esc(q)}</h3>${button('修改','edit','',`data-index="${i+6}" aria-label="修改背景第${i+1}题"`)}</div>${answerHTML(d.answers[i],i)}</div>`).join('')}</section><div class="actions">${button('提交模拟资料','submit','primary')}${button('返回上一题','back-question')}</div><p class="small muted">数量齐全不代表可以诊断。这里仅使用示意资料，不会生成实际养护建议。</p>`;}
function history(){return `${speechBlock('history-help','<p class="kicker">仅当前浏览器</p><h1>我的提交记录</h1><p>按提交时间找回刚才那次。点开后可回看原资料、回答和模拟反馈。</p>')}<div class="choices">${[...state.records].reverse().map(r=>button(`<strong>虚构树 ${r.tree} · ${r.id}</strong><span>${esc(date(r.created))}</span><span>材料不足，未形成建议</span><span>查看这次提交 →</span>`,'open','record',`data-record="${r.id}"`)).join('')||'<div class="card empty"><h2>还没有提交记录</h2><p>只准备、没有确认提交的资料不会出现在这里。</p></div>'}</div><div class="actions">${state.draft?button('继续未提交的准备','continue','primary'):button('开始新的准备','begin','primary')}${button('返回首页','home')}</div>`;}
function detail(){const r=currentRecord();if(!r)return '<p>找不到这次提交，请返回我的记录。</p>';return `<div class="ticket"><strong>已提交 · 虚构树 ${r.tree}</strong><span class="small">${r.id} · ${esc(date(r.created))}</span></div>${speechBlock('feedback-help','<p class="kicker">预设模拟情境 · 未进行真实诊断</p><h1>材料不足，未形成建议</h1><p>预设缺项：这次“局部 1”未能看清问题位置和相关细节。不是对示意图的实际判断。</p><p>重拍时让问题位置和相关细节清楚，按资料页既有指引准备其余照片。</p><p>准备好后可另开一次提交；这条记录和原材料会保留。</p>')}<p class="small boundary">这次提交只能回看，不能修改。重新准备会另开一份未提交资料；只有再次确认提交，才会多一条记录。</p><div class="actions">${button('重新准备一份资料','new-preparation','primary')}${button('返回我的记录','history')}</div><details class="card"><summary>回看这次提交的原资料与回答</summary><div class="thumbs">${LABELS.map((x,i)=>`<div class="card"><h3>${x}</h3>${art(i,r.slots[i])}<p class="small">示意图${r.slots[i]}</p></div>`).join('')}</div>${QUESTIONS.map((q,i)=>`<div class="checkline"><h3>${esc(q)}</h3>${answerHTML(r.answers[i],i)}</div>`).join('')}</details>`;}
function render(focus=false,keepPhoto=false){if(!keepPhoto)cancelPhotoTransition();stopSpeech();++photoView;const screen=halted?'<h1>记录暂时不可用</h1><p>已停止操作，保护原内容。</p>'+button('重试读取记录','retry','primary'):({home,step,review,history,detail}[state.route.screen])();$('app').innerHTML=`<p id="page-error" class="notice error" role="alert" ${issue?'':'hidden'}>${esc(issue)}</p>`+screen;if(focus){$('app').focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'});}}
let speechToken=0,utterance=null,speechTimer=null,speechTarget=null;
function speechStatus(text,active=false){$('speech-status').textContent=text;$('stop-speech').hidden=!active;}
function stopSpeech(text){const active=!!utterance;++speechToken;clearTimeout(speechTimer);utterance=null;speechTarget=null;if(active){try{window.speechSynthesis?.cancel();}catch(e){}speechStatus(text||'已停止朗读。');}}
function listen(id){const target=$(id);if(!target)return;if(speechTarget===id&&utterance){stopSpeech('已停止朗读。');return;}stopSpeech();const synth=window.speechSynthesis;if(!synth||typeof window.SpeechSynthesisUtterance!=='function'){speechStatus('当前浏览器不支持朗读。请看页面文字，仍可继续体验。');return;}let voice;try{voice=synth.getVoices().find(v=>/^zh([_-]|$)/i.test(v.lang)&&v.localService===true);}catch(e){speechStatus('暂时无法读取声音。请看页面文字，也可稍后再点。');return;}if(!voice){speechStatus('暂不能朗读：没有本机中文声音。可继续看文字操作。');return;}const text=target.innerText?.trim()||target.textContent.trim();if(!text)return;const token=++speechToken;try{utterance=new window.SpeechSynthesisUtterance(text);const u=utterance;speechTarget=id;u.lang=voice.lang;u.voice=voice;u.rate=.88;u.onstart=()=>{if(token!==speechToken)return;clearTimeout(speechTimer);speechStatus('正在朗读这段说明。',true);};u.onend=()=>{if(token!==speechToken)return;utterance=null;speechTarget=null;clearTimeout(speechTimer);speechStatus('这段说明已读完。');};u.onerror=()=>{if(token!==speechToken)return;stopSpeech();speechStatus('朗读未完成。请看页面文字，也可稍后再试。');};speechStatus('正在尝试朗读，可以随时停止。',true);speechTimer=setTimeout(()=>{if(token===speechToken){stopSpeech();speechStatus('朗读未能开始。请看页面文字，仍可继续体验。');}},4500);synth.speak(u);}catch(e){stopSpeech();speechStatus('朗读没有成功。请看页面文字，仍可继续体验。');}}
document.addEventListener('pointerdown',e=>{const el=e.target.closest('[data-action="photo"]');photoPress=null;if(el&&!el.disabled&&!photoTransit&&Date.now()>=photoGuardUntil&&Number(el.dataset.photoView)===photoView)photoPress={element:el,view:photoView};});
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el||el.disabled)return;const a=el.dataset.action;if(a==='listen')return listen(el.dataset.speech);if(a==='stop-speech')return stopSpeech('已停止朗读。');if(a==='cancel'){dialogIntent=null;$('confirm-dialog').close();return;}if(a==='confirm')return confirmAction();if(a==='retry')return read();if(halted)return;if(a==='save-note'){if(pending)flush();else if($('note'))saveNote(Number($('note').dataset.note),$('note').value);return;}if(!flush())return;if(a==='home'||a==='history')return navigate(a);if(a==='begin')return start();if(a==='continue'&&state.draft)return navigate('step',{index:state.draft.slots.findIndex(n=>n===null)===-1?6:state.draft.slots.findIndex(n=>n===null)});if(a==='photo')return capturePhoto(el,e);if(a==='answer'&&state.route.screen==='step'&&state.route.index>=6){const i=state.route.index-6;if(ANSWER_OPTIONS[i].some(o=>o.id===el.dataset.choice))return commit(s=>{s.draft.answers[i].choice=el.dataset.choice;},false);}if(a==='skip'&&state.route.screen==='step'&&state.route.index>=6)return commit(s=>{s.draft.answers[s.route.index-6].choice=null;},false);if(a==='next'&&state.route.screen==='step')return next();if(a==='previous'&&state.route.screen==='step')return previous();if(a==='edit'&&state.route.screen==='review')return navigate('step',{index:Number(el.dataset.index),edit:true});if(a==='back-question'&&state.route.screen==='review')return navigate('step',{index:8});if(a==='submit')return askSubmit();if(a==='open'&&state.records.some(r=>r.id===el.dataset.record))return navigate('detail',{recordId:el.dataset.record});if(a==='new-preparation'&&state.route.screen==='detail')return start(currentRecord().tree);});
document.addEventListener('input',e=>{if(e.target.matches('textarea[data-note]'))saveNote(Number(e.target.dataset.note),e.target.value);});
$('confirm-dialog').addEventListener('cancel',()=>{dialogIntent=null;});
window.addEventListener('storage',e=>{if(e.key===KEY||e.key===null){halted=true;stopSpeech();issue='另一页面已更改记录，已停止当前操作以避免覆盖。请重试读取。';dialogIntent=null;if($('confirm-dialog').open)$('confirm-dialog').close();render();}});
window.addEventListener('pagehide',()=>{cancelPhotoTransition();stopSpeech();});document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelPhotoTransition();stopSpeech();render(false);}});
window.addEventListener('beforeunload',e=>{cancelPhotoTransition();stopSpeech();if(pending){e.preventDefault();e.returnValue='';}});
// Browser inspection only; no real services, external writes or test controls.
window.PEGuided=Object.freeze({key:KEY,inspect:()=>clone(state),validate});
read();
})();
</script></body></html>
